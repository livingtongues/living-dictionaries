[project]
name = "ld-align"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pydantic",
    "requests>=2.32.5",
]

[project.optional-dependencies]
local = [
  "torch",
  "torchaudio",
]
modal = ["modal"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ld_align"]

[tool.uv]
# CPU-only torch wheels — every dev machine can align without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
